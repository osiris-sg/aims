apply plugin: 'com.android.application'

// Upload key for Play. Credentials live OUTSIDE the repo in
// ~/.gradle/gradle.properties (SITEJOBS_UPLOAD_*); a release build with them
// missing FAILS instead of producing an unsigned artifact (see the task-graph
// check below). Project-level so both the android block and the check see it.
def uploadProps = ["SITEJOBS_UPLOAD_STORE_FILE", "SITEJOBS_UPLOAD_STORE_PASSWORD", "SITEJOBS_UPLOAD_KEY_ALIAS", "SITEJOBS_UPLOAD_KEY_PASSWORD"]
def hasUploadKey = uploadProps.every { project.hasProperty(it) && project.property(it) }

android {
    namespace = "so.osiris.aims.field"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "so.osiris.aims.field"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Two channels, one applicationId:
    //  play  - the Google Play build (no HOME launcher filter)
    //  sunmi - the kiosk build for Sunmi handhelds (adds the HOME launcher
    //          filter via src/sunmi/AndroidManifest.xml so the device can boot
    //          straight into SiteJobs)
    flavorDimensions = ["channel"]
    productFlavors {
        play { dimension "channel" }
        sunmi { dimension "channel" }
    }

    signingConfigs {
        release {
            if (hasUploadKey) {
                storeFile file(project.property("SITEJOBS_UPLOAD_STORE_FILE"))
                storePassword project.property("SITEJOBS_UPLOAD_STORE_PASSWORD")
                keyAlias project.property("SITEJOBS_UPLOAD_KEY_ALIAS")
                keyPassword project.property("SITEJOBS_UPLOAD_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // Dev builds load the LAN dev server over plain http.
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { it.project == project && it.name ==~ /.*Release.*/ && !(it.name ==~ /.*(Lint|Test|UnitTest).*/) }
    if (wantsRelease && !hasUploadKey) {
        throw new GradleException("SiteJobs release build refused: upload key not configured. Set SITEJOBS_UPLOAD_STORE_FILE, SITEJOBS_UPLOAD_STORE_PASSWORD, SITEJOBS_UPLOAD_KEY_ALIAS and SITEJOBS_UPLOAD_KEY_PASSWORD in ~/.gradle/gradle.properties (never in the repo). Releases are never built unsigned.")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
