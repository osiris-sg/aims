# Render Blueprint for the WhatsApp DM bridge.
#
# A SECOND worker, separate from whatsapp-group-bridge: one linked device is
# one WhatsApp account, and this one carries a different phone for a different
# org. It also needs its own disk — two services sharing a session directory
# would fight over the same Chromium profile.
services:
  - type: worker
    name: whatsapp-dm-bridge-ciel
    runtime: docker
    repo: https://github.com/osiris-sg/aims
    branch: elroy/dev
    rootDir: whatsapp-dm-bridge
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: starter
    numInstances: 1
    autoDeploy: false # a redeploy restarts Chromium; do it deliberately
    disk:
      name: dm-session
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SESSION_DIR
        value: /data/.wwebjs_auth
      - key: AIMS_API_BASE
        value: https://aims-ahwy.onrender.com
      - key: AIMS_ORG_ID
        value: 09e55c23-e031-4254-8152-a373597b2cb3 # CIEL INTERIOR PTE. LTD.
      - key: BRIDGE_LABEL
        value: ciel-dm-bridge
      - key: AIMS_GROUP_BRIDGE_TOKEN
        sync: false # secret — set in the dashboard, matches the API's WHATSAPP_GROUP_BRIDGE_TOKEN
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
